# deal-radar 테제 파일
# "잘 크는 숨은 알짜"를 무엇으로 판별할지 정의한다. Claude가 사용자 피드백을 보고 이 파일을 수정·커밋한다.

global:
  max_company_age_years: 5        # 얼리 스테이지: 업력 5년 이하 (2026-11-05 사용자 피드백)
  min_score_to_report: 45         # 이 점수 이상만 후보 파일에 오른다
  max_candidates_per_day: 20      # 판단 단계로 넘기는 최대 후보 수
  queue_quota:                    # 소스별 최소 자리 (나머지는 점수순)
    nps: 10                       # 국민연금 단독 발견 (공시 없는 소규모 팀의 고용 급성장) = 주력
    localdata: 4                  # 인허가 단독 발견 (공장 증설·체인 확장)
  # 표준산업분류 앞자리. 젊은 첫 외감사의 1/3이 부동산(68)이고, 금융·발전·골프장·지주사는
  # 대부분 SPC나 대기업 분할법인이라 '조용히 잘 크는 회사'와 구조적으로 무관하다.
  exclude_industry_prefixes: ["68", "64", "65", "66", "35", "9112", "7151", "411"]  # 411 건물 건설(분양 시행 법인)
  exclude_name_patterns:          # 정규식. 공공·비영리·계열사성 이름 제외
    # 대기업 집단 계열사 (상호에 그룹명이 붙는 경우)
    - "(엘지|에이치디|에스케이|롯데|씨제이|한화|포스코|신세계|카카오|토스|쿠팡|네이버|현대자동차|현대모비스|아모레퍼시픽|엘에스)"
    - "(^|[^A-Za-z])(LG|SK|CJ|GS|HD|KT)([^A-Za-z]|$)"
    - "(인베스트먼트|자산운용|캐피탈|파트너스|홀딩스|지주)"
    - "어린이집|유치원"
    - "\\s\\S+점$"                  # 'OO 남원도통점' 같은 가맹·지점 법인 (가맹본부가 아니라 가맹점)
    - "공사$"
    - "공단"
    - "재단"
    - "협회"
    - "조합$"
    - "학교"
    - "병원"
    - "의료법인"
    - "교회"
    - "리츠|위탁관리부동산투자회사|투자회사$|PFV|피에프브이|자산관리"
    - "에스피씨|SPC|유동화|제\\d+호"

sources:
  dart:
    enabled: true
    backfill_start: "2024-01-01"   # 이 날짜 이후 감사보고서 이력으로 '첫 외감' 판별
    first_audit_horizon_days: 400  # 최근 N일 안에 처음 감사보고서를 낸 회사만 후보
    max_company_lookups_per_run: 6000
    max_documents_per_run: 1500
  localdata:
    enabled: true
    window_days: 180               # 이 기간 안의 신규 인허가를 '신규'로 본다
    industries:                    # 업종별로 data.go.kr 활용신청이 각각 필요
      - slug: food_manufacturing_processors
        label: 식품제조가공업
        thesis: food_mfg
  nps_monthly:                     # 국민연금 월간 전체 CSV → 젊은 법인 고용 패널 (주력 소스)
    enabled: true
    want_months: 13                # 최근 13개월 보유 → 12개월 성장 계산
    max_downloads_per_run: 13      # 첫 실행에 과거 12개월 일괄 백필 (115MB/월)
    store_max_age_years: 6.5       # 저장 대상: 국민연금 적용일 6.5년 이내 법인
    store_min_headcount: 5
    scan:
      min_headcount: 10            # 얼리 스테이지: 현재 가입자 10명 이상
      min_growth_12m: 1.0          # 작은 기저에서는 +50%가 흔하므로 12개월 2배 이상
      min_growth_6m: 0.6           # 또는 6개월 +60% 이상
  nps:                             # API는 최신 월만 제공 → 패널에 없는 후보의 현재 인원 보강용
    enabled: true
    months: 1
    max_lookups_per_run: 60

theses:
  food_mfg:
    label: 식품 제조 (다품종 소량 OEM 포함)
    dart_industry_prefixes: ["10", "11"]   # 표준산업분류: 10 식료품, 11 음료
  franchise_service:
    label: 프랜차이즈형 서비스 (방탈출 등)
    # 9113 체력단련·실내스포츠시설, 9119 기타 스포츠, 912 오락장(방탈출 91229 등),
    # 561 음식점, 562 주점·카페, 9611/9612 미용·피부관리. 골프장·스키장(9112)은 제외.
    dart_industry_prefixes: ["9113", "9119", "912", "561", "562", "9611", "9612"]
    note: 가맹 정보공개서 API(페어데이터) 연동 전까지는 DART·국민연금 신호로만 잡힌다

weights:
  # 2026-11-05 사용자 피드백: "매출이 꼭 백억 단위일 필요 없다, 더 얼리 스테이지".
  # 첫 외감(≈100억 돌파)은 늦은 신호라 비중을 낮추고, 소규모 팀의 꾸준한 고용 성장을 주력으로.
  dart_first_audit: 12            # 최근 처음 외감 대상 (늦은 신호)
  age_le_2y: 22
  age_le_3y: 16
  age_le_max: 6                   # 업력 3~5년
  late_stage_size: -15            # 매출 500억+ 또는 가입자 300명+
  revenue_growth_ge_50pct: 15
  revenue_growth_ge_25pct: 8
  op_margin_ge_10pct: 12          # 이익 체력
  op_margin_negative: -10
  localdata_expansion: 30         # 기존 사업자의 공장급(200㎡+) 신규 인허가 = 증설
  localdata_chain_rollout: 22     # 같은 브랜드 신규 매장 3곳+ = 체인 확장 (프랜차이즈형)
  localdata_multi_new: 15
  headcount_growth_12m_ge_100pct: 30   # 1년 새 고용 2배 이상
  headcount_growth_12m_ge_50pct: 18
  headcount_growth_12m_ge_25pct: 8
  headcount_new_scaleup: 15       # 12개월 전 미가입 → 지금 20명+
  early_team_size: 8              # 가입자 10~80명
  steady_growth: 10               # 관측 개월 대부분 증가·유지, 한 달 몰림 50% 이하
  lumpy_growth: -12               # 증가분 60%+가 한 달에 (분할·양수·위탁 전환)
  bill_per_head_high: 6           # 1인당 고지금액 40만원+ (≈월급 440만원+, 상위 15%)
  bill_per_head_rising: 6         # 1인당 고지금액 12개월 +10% 이상
  thesis_industry_match: 8
  foreign_subsidiary_hint: -15    # 'OO코리아 유한회사' 등 외국계 한국법인 의심
  transplant_first_year: -20      # 설립 첫해(부분연도) 매출 30억+ = 기존 사업 이전 의심
  likely_spinoff: -25             # 설립 3년 내 매출 1,500억+ 또는 고용 0→150명+
  multi_source_bonus: 10          # 서로 다른 소스 2개 이상에서 동시에 잡힘
