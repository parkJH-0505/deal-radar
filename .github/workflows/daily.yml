name: daily
# 매일 05:07 KST 수집 → 점수 → data/ 커밋. 07:30 KST에 Claude가 data/candidates/latest.json을 읽고 판단한다.
on:
  schedule:
    - cron: "17 17 * * *"   # 02:17 KST. GitHub 예약 실행은 수십 분~수 시간 밀릴 수 있어 07:23 판단 전에 여유를 둔다
  push:
    branches: [main]
    paths:
      - ".github/triggers/daily"   # 이 파일을 수정해 push하면 즉시 실행
  workflow_dispatch:
    inputs:
      date:
        description: "KST 기준 실행일 (비우면 오늘)"
        required: false

permissions:
  contents: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 첫 실행은 DART 이력 백필 때문에 오래 걸린다
    defaults:
      run:
        shell: bash
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      DART_KEY: ${{ secrets.DART_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기열에서 늦게 시작해도 직전 실행이 커밋한 최신 데이터 위에서 돈다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: |
          mkdir -p data/runs
          if [ -n "${{ inputs.date }}" ]; then
            python -m radar daily --date "${{ inputs.date }}"
          else
            python -m radar daily
          fi 2>&1 | tee data/runs/last_stdout.txt
          exit ${PIPESTATUS[0]}
      - name: Commit results
        if: always()
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "radar: $(date +%F) run"
            # data/는 생성물이다. 충돌하면 이번 실행 결과가 이긴다 (rebase에서 -X theirs = 재적용되는 이 커밋).
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && break
              git rebase --abort 2>/dev/null || true
              sleep $((i * 10))
            done
          fi
