name: daily
# 매일 05:07 KST 수집 → 점수 → data/ 커밋. 07:30 KST에 Claude가 data/candidates/latest.json을 읽고 판단한다.
on:
  schedule:
    - cron: "7 20 * * *"   # 20:07 UTC = 05:07 KST
  workflow_dispatch:
    inputs:
      date:
        description: "KST 기준 실행일 (비우면 오늘)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 첫 실행은 DART 이력 백필 때문에 오래 걸린다
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      DART_KEY: ${{ secrets.DART_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m radar daily --date "${{ inputs.date }}"
          else
            python -m radar daily
          fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "radar: $(date +%F) run"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
