name: probe
# 각 API를 소량 호출해 실제 응답 구조(필드명)를 data/probe/latest.txt로 커밋한다. 키는 마스킹된다.
# 실행 방법: .github/triggers/probe 파일을 수정해 push (또는 Actions 탭에서 수동 실행)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/triggers/probe"

permissions:
  contents: write

concurrency:
  group: probe   # 일일 수집과 별도로 즉시 실행
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      PYTHONUNBUFFERED: "1"
      PROBE_MODULE: radar.probe5   # 바꿔서 다른 실측 실행
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      DART_KEY: ${{ secrets.DART_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe APIs
        run: |
          mkdir -p data/probe
          { echo "probe at $(date -Iseconds)"; python -m ${PROBE_MODULE:-radar.probe}; } > data/probe/latest.txt 2>&1 || true
          # defensive: never commit anything that looks like a key
          if [ -n "$DATA_GO_KR_KEY" ]; then sed -i "s/$DATA_GO_KR_KEY/***/g" data/probe/latest.txt; fi
          if [ -n "$DART_KEY" ]; then sed -i "s/$DART_KEY/***/g" data/probe/latest.txt; fi
          tail -50 data/probe/latest.txt
      - name: Commit probe output
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git diff --cached --quiet || { git commit -m "probe: $(date +%F_%H%M)"; git pull --rebase --autostash origin main; git push origin HEAD:main; }
